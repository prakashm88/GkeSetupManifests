upstream node-echo-backend {
    server node-echo-backend:80;
}

server {

  listen 8080;
  root /usr/share/nginx/html;
  
  #location / {
  #  root   /usr/share/nginx/html;
  #  index  index.html index.htm;
  #  try_files $uri /index.html =404;
  #}
  
  location /ui {
    rewrite ^/ui(.*)$ $1 break;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }
  
  location /api {
    rewrite ^/api(.*)$ $1 break;
    proxy_pass http://node-echo-backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /version {
    js_content utils.version;
  }
  
  location = /hello {
    js_content main.hello;
  }

  location /jwt {
    return 200 $jwt;
  }

  location /callback {
    js_content github_oidc.callback;
  }

  location /validate {
    js_content github_oidc.validate;
  }

  location /secure {
    js_content github_oidc.auth_request;
    
    rewrite ^/secure(.*)$ $1 break;
    proxy_pass http://node-echo-backend;

    # Pass user info headers to upstream
    #proxy_set_header X-User-Id $session_user_id;
    #proxy_set_header X-User-Email $session_user_email;
    #proxy_set_header X-User-Name $session_user_name;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
}